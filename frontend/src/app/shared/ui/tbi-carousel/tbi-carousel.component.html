<div
  class="tbi-carousel"
  tabindex="0"
  role="group"
  [attr.aria-label]="ariaLabel()"
  (keydown.arrowleft)="anterior()"
  (keydown.arrowright)="siguiente()"
>
  @if (items().length > 1) {
    <span class="tbi-carousel__contador">{{ indiceActual() + 1 }} / {{ items().length }}</span>
  }

  <div class="tbi-carousel__stage">
    @if (items().length > 1) {
      <button
        matIconButton
        type="button"
        class="tbi-carousel__nav tbi-carousel__nav--prev"
        [attr.aria-label]="prevLabel()"
        (click)="anterior()"
      >
        <mat-icon>chevron_left</mat-icon>
      </button>
    }

    <div class="tbi-carousel__item">
      @if (items().length > 0) {
        <ng-container *ngTemplateOutlet="itemTemplate(); context: contexto()" />
      }
    </div>

    @if (items().length > 1) {
      <button
        matIconButton
        type="button"
        class="tbi-carousel__nav tbi-carousel__nav--next"
        [attr.aria-label]="nextLabel()"
        (click)="siguiente()"
      >
        <mat-icon>chevron_right</mat-icon>
      </button>
    }
  </div>
</div>
