<div class="mi-album">
  <header class="mi-album__header">
    <div class="mi-album__saludo-wrap">
      <h1 class="mi-album__saludo">{{ saludo() }}</h1>
      @if (nombreEvento(); as evento) {
        <p class="mi-album__evento">{{ evento }}</p>
      }
    </div>

    <div class="mi-album__acciones">
      @if (fotos().length > 0) {
        <div class="mi-album__densidad" role="group" aria-label="Tamaño de la grilla">
          <button
            matIconButton
            type="button"
            [class.activo]="densidad() === 2"
            (click)="densidad.set(2)"
            aria-label="Fotos grandes, 2 por fila"
            title="Grande"
          >
            <mat-icon>crop_square</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            [class.activo]="densidad() === 4"
            (click)="densidad.set(4)"
            aria-label="Fotos chicas, 4 por fila"
            title="Chico"
          >
            <mat-icon>grid_view</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            [class.activo]="densidad() === 'lista'"
            (click)="densidad.set('lista')"
            aria-label="Ver en lista"
            title="Lista"
          >
            <mat-icon>view_list</mat-icon>
          </button>
        </div>
      }

      <button
        matIconButton
        type="button"
        class="mi-album__carrito"
        (click)="irAlCarrito()"
        aria-label="Ver carrito"
        title="Carrito"
      >
        <mat-icon [matBadge]="carrito.totalItems()" [matBadgeHidden]="carrito.totalItems() === 0" matBadgeSize="small">
          shopping_cart
        </mat-icon>
      </button>
    </div>
  </header>

  @if (cargando()) {
    <p class="mi-album__hint">Cargando tus fotos…</p>
  } @else if (fotos().length === 0) {
    <p class="mi-album__hint">Todavía no hay fotos disponibles para vos.</p>
  } @else {
    <div
      class="grilla"
      [class.grilla--lista]="densidad() === 'lista'"
      [style.grid-template-columns]="gridTemplateColumns()"
    >
      @for (foto of fotos(); track foto.id) {
        <div class="grilla__item">
          <button
            class="grilla__tile"
            type="button"
            (click)="verPreview(foto)"
            [attr.aria-label]="'Ver foto de ' + nombreParticipante(foto)"
          >
            <tbi-foto-familia-img class="grilla__img" [fotoId]="foto.id" />
            @if (densidad() === 'lista') {
              <span class="grilla__etiqueta">{{ nombreParticipante(foto) }}</span>
            } @else if (foto.participanteId === null) {
              <span class="grilla__chip">
                <mat-icon inline>group</mat-icon>
                Grupal
              </span>
            }
          </button>

          <button
            class="grilla__add"
            matIconButton
            type="button"
            (click)="agregarAlCarrito(foto, $event)"
            [attr.aria-label]="
              carrito.cantidadTotalDeFoto(foto.id) > 0
                ? carrito.cantidadTotalDeFoto(foto.id) + ' en el carrito, tocar para editar'
                : 'Agregar esta foto al carrito'
            "
            title="Agregar al carrito"
          >
            <mat-icon
              [matBadge]="carrito.cantidadTotalDeFoto(foto.id)"
              [matBadgeHidden]="carrito.cantidadTotalDeFoto(foto.id) === 0"
              matBadgeSize="small"
              matBadgeColor="accent"
            >
              add_shopping_cart
            </mat-icon>
          </button>
        </div>
      }
    </div>
  }
</div>
